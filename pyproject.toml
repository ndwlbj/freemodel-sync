[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freemodel-sync"
dynamic = ["version"]
description = "Discover, test and rank free LLMs, then sync a primary model + fallbacks into the configs of tools you already use. Not a proxy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ndwlbj" }]
maintainers = [{ name = "ndwlbj" }]
keywords = ["llm", "openrouter", "free-models", "model-routing", "config", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
yaml-comments = ["ruamel.yaml>=0.17.22"]
dev = ["pytest>=7", "pytest-cov>=4", "jsonschema>=4.18", "ruff==0.17.2", "mypy==2.4.0"]

[project.scripts]
freemodel-sync = "freemodel_sync.cli:main"

[project.urls]
Homepage = "https://github.com/ndwlbj/freemodel-sync"
Repository = "https://github.com/ndwlbj/freemodel-sync"
Issues = "https://github.com/ndwlbj/freemodel-sync/issues"
Changelog = "https://github.com/ndwlbj/freemodel-sync/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/freemodel_sync/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "scripts",
  "spec",
  "README.md",
  "README.zh-CN.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freemodel_sync"]

[tool.hatch.build.targets.wheel.force-include]
# the shared rule files (spec/README.md); read by freemodel_sync.spec
"spec/providers.json" = "freemodel_sync/spec/providers.json"
"spec/ranking.json" = "freemodel_sync/spec/ranking.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true

[tool.mypy]
# Lenient start (F1): check src/ only, no strict mode; tighten over time.
files = ["src"]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF100"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
