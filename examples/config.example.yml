# freemodel-sync example configuration.
# Copy to ~/.config/freemodel-sync/config.yml (or pass -c FILE) and adjust.
# API keys are NEVER stored here: they are read from the environment
# variables named below (e.g. export OPENROUTER_API_KEY=...).

# Every enabled provider below feeds one ranking. This section replaces the
# default (OpenRouter only): list the providers you want, or set enabled: false.
providers:
  openrouter:
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    probe_max_tokens: 16          # completion budget of each probe request
    # daily_free_limit: 50        # override testing.daily_free_limit for this provider only
  groq:
    enabled: false                # set to true to use Groq as well
    api_key_env: GROQ_API_KEY
    # Groq's API has no prices: models are free only on Groq's Free plan.
    # Nothing is listed or probed until you confirm your plan here.
    plan: free
  sensenova:
    enabled: false                # SenseNova Token Plan (public beta), off by default
    api_key_env: SENSENOVA_API_KEY
    # The API has no quota endpoint and prices can change: nothing is listed
    # or probed until you confirm you are in the Token Plan beta.
    plan: token-plan
    models: [deepseek-v4-flash, sensenova-6.8-flash-lite]  # optional allowlist
    # free_until: 2026-12-31      # optional reminder date for the beta end
  bailian:
    enabled: false                # Alibaba Cloud Bailian / DashScope (Beijing), off by default
    api_key_env: DASHSCOPE_API_KEY
    region: cn-beijing            # Bailian's compatible endpoint is Beijing-only
    # Nothing is listed or probed unless this is confirmed AND models is non-empty.
    free_quota_guard: confirmed   # console switch "stop when the free quota is used up"
    models:
      - id: deepseek-v3.2         # example id; use the ids shown in the console
        quota: {unit: tokens, period: total, limit: 1000000}  # hand-entered, unverified
      # - id: qwen3-8b-distill    # distilled models are marked tools=false

filters:
  require_tools: false          # only keep models that support tool calling
  min_context: 32000            # minimum context window (tokens)
  exclude_expiring_within_days: 3
  include: []                   # globs on model ids (case-insensitive), e.g. ["deepseek/*", "*qwen*"]
  exclude: []                   # extra globs to drop
  exclude_non_chat: true        # drop safety classifiers, embedding/rerank and speech models

testing:
  max_tests: 5                  # new probe requests per run (cached results are reused)
  cache_ttl_hours: 6
  transient_ttl_minutes: 30     # retry models that hit upstream 429/5xx/timeouts after this
  timeout_s: 30                 # per-read timeout of probe requests only (model list/quota: fixed 30s)
  reserve_requests: 10          # leave this many free requests/day for your real usage
  daily_free_limit: null        # override free requests/day; default: OpenRouter's free_model_daily_requests
  # Used by the first enabled provider; the others get results.<provider>.json next to it,
  # so reordering `providers` moves the daily counters (see README).
  cache_path: ~/.cache/freemodel-sync/results.json

ranking:
  fallback_count: 3
  fallbacks_allow_untested: false   # true: fill empty fallback slots with never-probed models (flagged)
  weights:
    availability: 100
    latency: 30
    context: 20
    tools: 15
    expiry_penalty: 50
    untested_penalty: 40
    capacity_penalty: 50          # queue / no capacity: below untested, above hard failures
  capacity_downgrade_after: 3     # this many capacity failures in a row -> not selectable

output:
  ranking_json: ~/.cache/freemodel-sync/ranking.json

# Backups of target files made before each change. Backups are created with
# mode 0600 (or stricter, matching the original). Per-target override:
# options.keep_backups / options.backup_dir.
backups:
  keep: 5                       # 0 disables backups (existing backups are then left alone)
  dir: null                     # default: next to each target file

state_path: ~/.local/state/freemodel-sync/state.json

# Files to update. Every target is commented out: uncomment the ones you use
# and change the paths to your own files. A missing target file is created
# (with a warning), so a placeholder path left here would create it.
# Options every target accepts:
#   providers: [openrouter]   only pick models from these providers (the tool only has their keys)
#   keep_backups: 5           override backups.keep for this target
#   backup_dir: ~/backups     override backups.dir for this target
targets:
  # Generic OpenAI-compatible env file (only these three variables are managed).
  # - adapter: openai-env
  #   path: ~/my-app/.env
  #   options:
  #     base_url_var: OPENAI_BASE_URL
  #     model_var: OPENAI_MODEL
  #     fallbacks_var: OPENAI_FALLBACK_MODELS
  #     providers: [openrouter]

  # Generic YAML config: sets base_url / model / fallback_models under `llm`.
  # - adapter: openai-yaml
  #   path: ~/my-app/config.yml
  #   options:
  #     key_path: llm
  #     # auto (default): keep comments with ruamel.yaml, refuse a lossy PyYAML re-dump;
  #     # true: require ruamel.yaml; false: always re-dump with PyYAML
  #     preserve_comments: auto

  # dsh (DeepSeek Harness) cordis.patch.yml-style file: manages only the
  # `agent-default-model` entry. Map freemodel-sync provider names to the
  # provider ids configured in your dsh setup.
  # - adapter: dsh
  #   path: ~/path/to/bot-model.yml
  #   options:
  #     entry_id: agent-default-model
  #     provider_map:
  #       openrouter: openrouter
  #     # provider_name: openrouter   # use this dsh provider id whatever the model's provider
  #     # entry_name: Default model   # `name` of the managed entry (default: keep the existing one)
  #     # check_model: true           # refuse a model missing from the file's provider `models` list

  # AstrBot (experimental): updates the model of an EXISTING provider entry in
  # data/cmd_config.json (top-level `model` on AstrBot >= 4.10, model_config.model
  # on older versions). Create the provider in AstrBot first; restart AstrBot after a sync.
  # - adapter: astrbot
  #   path: ~/AstrBot/data/cmd_config.json
  #   options:
  #     provider_id: openrouter

# Notifications when the primary model changes. Commented out: a configured
# channel whose environment variables are missing logs a warning on every switch.
notify:
  # Telegram: token and chat id are read from these environment variables.
  # telegram:
  #   bot_token_env: TELEGRAM_BOT_TOKEN
  #   chat_id_env: TELEGRAM_CHAT_ID
  # Generic webhook (e.g. a QQ bot bridge). JSON body:
  # {"event": "primary_changed", "old": ..., "new": ..., "fallbacks": [...], "text": ...}
  # webhook:
  #   url_env: FREEMODEL_SYNC_WEBHOOK_URL   # keep the URL (it usually has a token) out of this file
