name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to a known runner image rather than ubuntu-latest, so a runner
    # image change cannot drop a Python version from setup-python unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # with the optional ruamel.yaml extra; the minimum-deps job covers the PyYAML-only path.
          # Tool versions (ruff, mypy) are pinned once, in the dev extra of pyproject.toml.
          python -m pip install -e ".[dev,yaml-comments]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=freemodel_sync --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke test
        run: freemodel-sync --version && freemodel-sync adapters

  test-os:
    # Windows and macOS: the oldest and newest supported Python. Lint, format and
    # type checks are platform independent and run in the test job above.
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,yaml-comments]"
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          freemodel-sync --version
          freemodel-sync adapters

  minimum-deps:
    name: test (minimum dependency versions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx==0.24.0" "PyYAML==6.0" pytest
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest

  secret-scan:
    # gitleaks with the repository's .gitleaks.toml (default rules + the key
    # formats of OpenRouter, Groq, SenseNova and Bailian/DashScope). Pull
    # requests scan only their own commits; pushes to main scan the history.
    # The binary is pinned by version and SHA-256, like the actions are by SHA.
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --no-banner --redact --config .gitleaks.toml)
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            args+=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          # same pins as release.yml, so CI checks what a release would build
          python -m pip install --upgrade "build==1.6.1" "twine==7.0.0"
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the wheel and smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/freemodel-sync --version
          # the shared rule files (spec/) must ship inside the wheel
          cd /tmp && /tmp/wheel-venv/bin/python -c "from freemodel_sync import spec; spec.providers_spec(); spec.ranking_spec(); print(spec.spec_dir())"
