name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Ubuntu 26.04 (ubuntu-latest) has no Python 3.9 build for setup-python.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # with the optional ruamel.yaml extra; the minimum-deps job covers the PyYAML-only path
          # ruff is pinned (same pin as the dev extra in pyproject.toml) so format/lint results do not
          # change when a new ruff release comes out; bump both together
          python -m pip install -e ".[dev,yaml-comments]" "ruff==0.17.2"
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Test
        run: pytest --cov=freemodel_sync --cov-report=term-missing --cov-fail-under=80
      - name: CLI smoke test
        run: freemodel-sync --version && freemodel-sync adapters

  minimum-deps:
    name: test (minimum dependency versions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx==0.24.0" "PyYAML==6.0" pytest
          python -m pip install --no-deps -e .
      - name: Test
        run: pytest

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Install the wheel and smoke test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/freemodel-sync --version
