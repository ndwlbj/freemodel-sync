name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored.
# One-time setup: see "Releasing" in CONTRIBUTING.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/tags/... makes the checkout fail unless the input is a real tag
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches __version__
        run: |
          python - <<'PY'
          import os, re, sys
          tag = os.environ["RELEASE_TAG"]
          expected = tag[1:] if tag.startswith("v") else tag
          text = open("src/freemodel_sync/__init__.py", encoding="utf-8").read()
          match = re.search(r'^__version__ = "([^"]+)"', text, re.M)
          version = match.group(1) if match else None
          if version != expected:
              print(f"::error::tag {tag!r} does not match __version__ {version!r}")
              sys.exit(1)
          print(f"tag {tag} matches __version__ {version}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade "build==1.6.1" "twine==7.0.0"
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Check built file versions
        run: |
          version="${RELEASE_TAG#v}"
          ls dist
          test -f "dist/freemodel_sync-${version}.tar.gz"
          test -f "dist/freemodel_sync-${version}-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/freemodel-sync/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
